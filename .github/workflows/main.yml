name: Build MPC-HC for Windows XP

on:
  push:
    branches: [ develop, master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-xp:
    name: Build XP (x86 Pentium 4 Prescott)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Submódulos (URLs corrigidas)
        shell: cmd
        run: |
          git config --global url."https://gitea.1f0.de/LAV/".insteadOf "git://git.1f0.de/"
          git config --global url."https://code.videolan.org/videolan/".insteadOf "git://git.videolan.org/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Instalar compilador XP e ferramentas (YASM e v141_xp)
        shell: powershell
        run: |
          choco install yasm -y --no-progress
          Copy-Item "C:\ProgramData\chocolatey\bin\yasm.exe" "C:\Windows\System32\yasm.exe" -Force
          Copy-Item "C:\ProgramData\chocolatey\bin\yasm.exe" "src\yasm.exe" -Force
          Set-Content -Path "src\YASM.bat" -Value "@echo off`nyasm.exe %*"

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          Start-Process -FilePath $installer -ArgumentList "modify --quiet --norestart --productId Microsoft.VisualStudio.Product.Enterprise --channelId VisualStudio.17.Release --add Microsoft.VisualStudio.Component.WinXP --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --add Microsoft.VisualStudio.Component.VC.v141.MFC --add Microsoft.VisualStudio.Component.VC.ATLMFC" -Wait

      - name: Preparar DirectX 9 SDK (Sem ficheiros conflitantes)
        shell: powershell
        run: |
          $dest = "$env:TEMP\DXSDK_Jun10.exe"
          (New-Object Net.WebClient).DownloadFile("https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe", $dest)
          & 7z x $dest -o"C:\DXSDK" "DXSDK/Include/*" "DXSDK/Lib/*" -y | Out-Null
          Remove-Item $dest -Force
          
          # Eliminar os ficheiros que geram erro C2365 / C2011 contra o Windows SDK 7.1A
          Remove-Item "C:\DXSDK\DXSDK\Include\d3dcommon.h" -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\DXSDK\DXSDK\Include\d3d10*.h" -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\DXSDK\DXSDK\Include\d3d11*.h" -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\DXSDK\DXSDK\Include\dxgi*.h" -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\DXSDK\DXSDK\Include\D3Dcompiler.h" -Force -ErrorAction SilentlyContinue

          echo "DXSDK_DIR=C:\DXSDK\DXSDK\" >> $env:GITHUB_ENV

      - name: Colocar filtros LAV x86
        shell: powershell
        run: |
          $lavZip = "$env:TEMP\LAVFilters.zip"
          (New-Object Net.WebClient).DownloadFile("https://github.com/Nevcairiel/LAVFilters/releases/download/0.70.2/LAVFilters-0.70.2-x86.zip", $lavZip)
          New-Item -ItemType Directory -Force -Path "bin\mpc-hc_x86\LAVFilters" | Out-Null
          New-Item -ItemType Directory -Force -Path "src\thirdparty\LAVFilters\bin_x86" | Out-Null
          Expand-Archive -Path $lavZip -DestinationPath "bin\mpc-hc_x86\LAVFilters" -Force
          Copy-Item "bin\mpc-hc_x86\LAVFilters\*" "src\thirdparty\LAVFilters\bin_x86\" -Force
          Remove-Item $lavZip -Force
          Set-Content -Path "src\thirdparty\LAVFilters\build_lavfilters.bat" -Value "@echo off`nexit /b 0"

      - name: Corrigir version.h (Eliminar erro RC1017)
        shell: powershell
        run: |
          Set-Content -Path "update_version.bat" -Value "@echo off`nexit /b 0"
          if (Test-Path "build\update_version.bat") {
            Set-Content -Path "build\update_version.bat" -Value "@echo off`nexit /b 0"
          }

          $verContent = @"
          #pragma once
          #define MPC_VERSION_NUM 1,7,13,0
          #define MPC_VERSION_STR "1.7.13"
          #define MPC_VERSION_VER_MAJOR 1
          #define MPC_VERSION_VER_MINOR 7
          #define MPC_VERSION_VER_BUILD 13
          #define MPC_VERSION_REV 0
          #define MPC_VERSION_REV_STR "0"
          #define MPC_VERSION_REV_HASH "xp"
          "@
          Set-Content -Path "include\version.h" -Value $verContent

      - name: Compilar MPC-HC (WinXP / Prescott)
        shell: cmd
        env:
          CL: /arch:SSE2 /Oi /Ot /Oy /D_SILENCE_ALL_CXX17_DEPRECATION_WARNINGS /D_SILENCE_ALL_MS_EXT_DEPRECATION_WARNINGS
        run: |
          msbuild mpc-hc.sln /p:Configuration="Release" /p:Platform="Win32" /p:PlatformToolset="v141_xp" /p:TargetPlatformVersion="7.0" /m

      - name: Disponibilizar executável compilado
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-XP-Prescott-x86
          path: bin/mpc-hc_x86/**
