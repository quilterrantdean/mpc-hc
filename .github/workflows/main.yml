name: Build MPC-HC for Windows XP

on:
  push:
    branches: [ develop, master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-xp:
    name: Build XP (x86 Pentium 4 Prescott)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false # Desativado aqui para corrigirmos as URLs no passo seguinte
          fetch-depth: 0

      - name: Redirecionar URLs antigas e descarregar submódulos
        shell: cmd
        run: |
          git config --global url."https://gitea.1f0.de/LAV/".insteadOf "git://git.1f0.de/"
          git config --global url."https://code.videolan.org/videolan/".insteadOf "git://git.videolan.org/"
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Instalar ferramentas auxiliares (NASM e YASM)
        shell: powershell
        run: |
          choco install nasm yasm -y --no-progress

      - name: Instalar suporte para Windows XP (v141_xp)
        shell: powershell
        run: |
          Write-Host "A instalar o toolset v141_xp no Visual Studio..."
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          Start-Process -FilePath $installer -ArgumentList "modify --quiet --norestart --productId Microsoft.VisualStudio.Product.Enterprise --channelId VisualStudio.17.Release --add Microsoft.VisualStudio.Component.WinXP --add Microsoft.VisualStudio.Component.VC.v141.x86.x64" -Wait
          Write-Host "Instalação do toolset XP concluída."

      - name: Compilar MPC-HC (x86 Release / Prescott SSE2)
        shell: cmd
        env:
          CL: /arch:SSE2 /Oi /Ot /Oy
        run: |
          call build.bat x86 Release

      - name: Disponibilizar ficheiros para download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-XP-Prescott-x86
          path: |
            bin/mpc-hc_x86/mpc-hc.exe
            bin/mpc-hc_x86/*.dll
            bin/mpc-hc_x86/*.ax
            bin/mpc-hc_x86/*.ini
            distrib/**.7z
            distrib/**.zip
          if-no-files-found: warn
