name: qwen-Build MPC-HC (Windows XP / Pentium 4 HT - Win32)

# ----------------------------------------------------------------------------
# Compila o MPC-HC (ramo develop do fork) para Windows XP, 32 bits (Win32),
# otimizado para CPU Pentium 4 HT "Prescott":
#   * toolset v141_xp (VS 2017) -> gera binários com subsistema 5.01 (XP)
#   * _WIN32_WINNT=0x0501 / WINVER=0x0501 / _WIN32_IE=0x0600
#   * /arch:SSE2 (Prescott suporta SSE2; NÃO emite AVX/AVX2/FMA — Prescott-2M
#     tem SSE3 mas este build fica seguro mesmo em Willamette/Northwood)
#   * LAVFilters/FFmpeg compilados pelo script MSVC oficial do projeto
#     (build_lavfilters.bat) que já usa runtime-dispatch cpuid nos .asm,
#     portanto as rotinas otimizadas para Prescott só correm se a CPU as suportar
# O workflow aplica os patches diretamente na cópia de trabalho do runner
# (não ficam commits no repositório).
# ----------------------------------------------------------------------------

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Configuração'
        required: true
        default: 'Release'
        type: choice
        options: [Release, Debug]

env:
  CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}

jobs:
  build-win32-xp:
    name: MPC-HC Win32 (XP + Pentium 4 HT)
    runs-on: windows-2022

    steps:
      - name: Checkout (recursivo — inclui LAVFilters e FFmpeg)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # As imagens windows-2022/2025 já trazem VS 2022 com o componente
      # "VC.14.16 build tools (vs2017-toolset)" = toolset v141/v141_xp.
      - name: Localizar VS 2017 (toolset v141_xp)
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -products * -latest `
                  -requires Microsoft.VisualStudio.Component.VC.v141.x86.x64 `
                  -property installationPath
          if (-not $path) {
            $path = & $vswhere -products * -latest -releaseChannel beta `
                    -requires Microsoft.VisualStudio.Component.VC.v141.x86.x64 `
                    -property installationPath
          }
          if (-not $path) {
            Write-Host "::error::Toolset v141 (VS2017) não encontrado no runner."
            exit 1
          }
          $xp = Join-Path $path "MSBuild\Microsoft\VC\v150\Platforms\Win32\PlatformToolsets\v141_xp"
          if (-not (Test-Path $xp)) {
            Write-Host "::warning::v141_xp não detetado em $xp — a instalação pode demorar mais ou falhar."
          }
          "vs_path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "VS com v141_xp: $path"

      - name: Patchar fontes para Windows XP + Pentium 4 (SSE2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # --- 1) src/platform.props: forçar toolset v141_xp ---------------
          $f = 'src/platform.props'
          $c = Get-Content $f -Raw
          $c = $c -replace '(<PlatformToolset Condition="''\$\(VisualStudioVersion\)'' == ''15\.0''">)v141(</PlatformToolset>)', '${1}v141_xp${2}'
          Set-Content $f $c -NoNewline
          if ($c -notmatch 'v141_xp') { throw "Falha ao patchar $f" }

          # --- 2) src/common.props ------------------------------------------
          $f = 'src/common.props'
          $c = Get-Content $f -Raw

          # 2a) substituir a condição v141 por atribuição direta v141_xp
          $c = $c -replace '<PlatformToolset Condition="''\$\(VisualStudioVersion\)'' == ''15\.0''">v141</PlatformToolset>', `
                          '<PlatformToolset>v141_xp</PlatformToolset>'

          # 2b) target de SO: Windows Vista -> Windows XP (0x0501)
          $c = $c -replace 'WINVER=0x0601;_WIN32_WINNT=0x0601;_WIN32_IE=0x0900', `
                           'WINVER=0x0501;_WIN32_WINNT=0x0501;_WIN32_IE=0x0600'

          # 2c) /std:c++latest exige >=19.30 (VS2019+); com v141 usar c++17.
          #     /Zo é ignorado sem PDB em configs antigas — manter /Zi via DebugInformationFormat.
          $c = $c -replace '/std:c\+\+latest', '/std:c++17'
          $c = $c -replace ' /Zo(?= )', ' '

          # 2d) instruções: Prescott = SSE2 (Nada de AVX/AVX2/FMA)
          $c = $c -replace '<EnableEnhancedInstructionSet([^>]*)>StreamingSIMDExtensions2</EnableEnhancedInstructionSet>', `
                           '<EnableEnhancedInstructionSet$1>StreamingSIMDExtensions2</EnableEnhancedInstructionSet>'

          Set-Content $f $c -NoNewline
          if ($c -notmatch 'v141_xp')                 { throw "Falha: toolset em $f" }
          if ($c -notmatch '_WIN32_WINNT=0x0501')     { throw "Falha: WINVER em $f" }
          if ($c -match '/std:c\+\+latest')           { throw "Falha: std em $f" }

          # --- 3) .vcxproj que fixam PlatformToolset=v141 explicitamente ----
          Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
            $t = Get-Content $_.FullName -Raw
            if ($t -match '<PlatformToolset>v141</PlatformToolset>') {
              $t = $t -replace '<PlatformToolset>v141</PlatformToolset>', '<PlatformToolset>v141_xp</PlatformToolset>'
              Set-Content $_.FullName $t -NoNewline
              Write-Host "patch toolset: $($_.Name)"
            }
          }

          # --- 4) Versão do subsistema PE: 5.01 (obrigatório p/ XP) ---------
          #     Aplicado globalmente via Directory.Build.targets para todos
          #     os projetos da solução (incl. submódulos).
          $dbt = @'
          <?xml version="1.0" encoding="utf-8"?>
          <Project>
            <PropertyGroup>
              <!-- Target Windows XP x86 -->
              <MPCHC_XP_TARGET>true</MPCHC_XP_TARGET>
            </PropertyGroup>
            <ItemDefinitionGroup Condition="'$(Platform)'=='Win32'">
              <Link>
                <AdditionalOptions>/SUBSYSTEM:WINDOWS,5.01 %(AdditionalOptions)</AdditionalOptions>
              </Link>
              <!-- Pentium 4 Prescott/Prescott-2M: SSE2 disponível no compilador.
                   EnableEnhancedInstructionSet=StreamingSIMDExtensions2 (/arch:SSE2)
                   já vem definido em src/common.props para Release|Win32. -->
            </ItemDefinitionGroup>
          </Project>
          '@
          Set-Content -Path 'Directory.Build.targets' -Value $dbt

          Write-Host "== Resumo dos patches =="
          Select-String -Path 'src/common.props' -Pattern 'PlatformToolset|WIN32_WINNT|std:c\+\+' | ForEach-Object { $_.Line.Trim() }

      - name: Escrever build.user.bat
        shell: pwsh
        run: |
          $vs = '${{ steps.vs.outputs.vs_path }}'
          @(
            '@ECHO OFF'
            'SET "MSYSTEM=MINGW32"'
            'SET "MPCHC_MSYS=C:\msys64"'
            'SET "MPCHC_MINGW32=C:\msys64\mingw32"'
            'SET "MPCHC_MINGW64=C:\msys64\mingw64"'
            'SET "MPCHC_GIT=C:\Program Files\Git"'
            "SET `"MPCHC_VS_PATH=$vs`""
            'SET "MPCHC_WINSDK_VER=8.1"'
          ) | Set-Content -Path 'build.user.bat' -Encoding ASCII
          Get-Content 'build.user.bat'

      # yasm é necessário para o gas-preprocessor nos .asm de FFmpeg/LAV.
      - name: Instalar YASM
        shell: pwsh
        run: |
          $dst = "C:\msys64\usr\bin"
          if (-not (Get-Command yasm -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri 'https://github.com/yasm/yasm/releases/download/v1.3.0/win64-yasm.exe' -OutFile "$dst\yasm.exe"
          }
          yasm --version

      - name: Build (Win32, ${{ env.CONFIGURATION }}, VS2017)
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          call build.bat Win32 %CONFIGURATION% VS2017
          if errorlevel 1 exit /b 1

      - name: Verificar versão do subsistema (tem de ser 5.01 / 5.02)
        shell: pwsh
        run: |
          $exe = ".\bin\mpc-hc_x86\mpc-hc.exe"
          if (-not (Test-Path $exe)) { Write-Error "mpc-hc.exe não encontrado!" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $osMin  = [BitConverter]::ToUInt16($bytes, $peOff + 48)  # MajorOperatingSystemVersion
          $osMaj  = [BitConverter]::ToUInt16($bytes, $peOff + 40)
          $subMin = [BitConverter]::ToUInt16($bytes, $peOff + 52)  # MinorSubsystemVersion
          $subMaj = [BitConverter]::ToUInt16($bytes, $peOff + 44)
          Write-Host ("Subsystem version: {0}.{1:D2}  OS version: {2}.{3:D2}" -f $subMaj, $subMin, $osMaj, $osMin)
          if ($subMaj -lt 5 -or ($subMaj -eq 5 -and $subMin -gt 2)) {
            Write-Error "Versão do subsistema incompatível com XP!"
          }

      - name: Recolher binários (exe + filtros LAV + DLLs)
        shell: pwsh
        run: |
          $pkg = "MPC-HC-XP-P4-Win32"
          New-Item -ItemType Directory -Force -Path "out\$pkg" | Out-Null
          Copy-Item "bin\mpc-hc_x86\*"          "out\$pkg\" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "bin\Filters_x86\*"         "out\$pkg\Filters\" -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path "bin\LAVFilters") {
            Copy-Item "bin\LAVFilters\*"        "out\$pkg\LAVFilters\" -Recurse -Force -ErrorAction SilentlyContinue
          }
          Compress-Archive -Path "out\$pkg\*" -DestinationPath "$pkg.zip" -Force
          Get-ChildItem "$pkg.zip" | Format-Table Name, Length

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-XP-Pentium4-Win32
          path: MPC-HC-XP-P4-Win32.zip
          if-no-files-found: error

      - name: Anexar logs de erro se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: bin/logs/
          if-no-files-found: ignore
